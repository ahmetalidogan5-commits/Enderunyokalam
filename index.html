<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-title" content="Bursa Enderun">

<link rel="apple-touch-icon" href="logo.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;user-select:none}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,sans-serif;background:#fbfcfe;color:#0f172a;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.wash{position:absolute;border-radius:50%;filter:blur(90px);opacity:.15}
.wash.a{width:520px;height:520px;background:#10b981;top:-190px;left:-150px;animation:drift 26s ease-in-out infinite alternate}
.wash.b{width:560px;height:560px;background:#f59e0b;bottom:-230px;right:-170px;animation:drift 32s ease-in-out infinite alternate-reverse}
.wash.c{width:380px;height:380px;background:#6366f1;top:38%;left:-190px;opacity:.10;animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(70px,46px) scale(1.1)}}
.bigstar{position:absolute;right:-150px;top:110px;width:540px;height:540px;opacity:.055;animation:spin 150s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.topline{position:fixed;top:0;left:0;right:0;height:4px;z-index:50;background:linear-gradient(90deg,#059669,#f59e0b,#e11d48,#4f46e5,#059669);background-size:300% 100%;animation:slide 8s linear infinite}
@keyframes slide{to{background-position:300% 0}}
main{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:30px 20px 80px}
.masthead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 0 4px}
.emblem{width:85px;height:85px;flex:none;filter:drop-shadow(0 8px 16px rgba(5,150,105,.28));animation:floaty 6s ease-in-out infinite;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:16px;overflow:hidden}
.emblem img{width:100%;height:100%;object-fit:contain}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.brand .eyebrow{letter-spacing:.32em;font-weight:800;font-size:11px;color:#059669;text-transform:uppercase}
.brand h1{font-family:'Unbounded';font-weight:900;font-size:clamp(26px,4.6vw,44px);letter-spacing:.5px;line-height:1.08;color:#064e3b}
.brand h1 .dot{color:#d97706;font-size:.55em;vertical-align:.5em;margin-left:6px;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
.clockbox{margin-left:auto;text-align:right}
.clock{font-family:'Unbounded';font-weight:700;font-size:clamp(20px,3vw,30px);font-variant-numeric:tabular-nums}
.clockdate{font-size:13px;font-weight:600;color:#64748b;margin-top:2px}
.divider{height:3px;border-radius:99px;margin:18px 0 6px;background:linear-gradient(90deg,#059669,#f59e0b,#e11d48,#4f46e5);background-size:250% 100%;animation:slide 9s linear infinite}
.today-strip{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px 16px;margin-top:16px;box-shadow:0 8px 20px -14px rgba(15,23,42,.25);animation:rise .5s both}
.daypill{background:#065f46;color:#fff;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:99px;letter-spacing:.03em}
.dpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:99px;color:var(--cc);background:color-mix(in srgb,var(--cc) 9%,#fff);border:1.5px solid color-mix(in srgb,var(--cc) 35%,#fff)}
.sechead{margin:28px 0 4px}
.sec-eyebrow{font-size:11px;font-weight:800;letter-spacing:.3em;color:#b45309;text-transform:uppercase}
.sechead h2{font-family:'Unbounded';font-weight:700;font-size:clamp(19px,3vw,26px);margin-top:4px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:18px;margin-top:18px}
.classcard{position:relative;overflow:hidden;border:none;border-radius:22px;padding:20px;color:#fff;text-align:left;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 16px 32px -16px rgba(15,23,42,.4);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;animation:rise .55s both}
.classcard:hover{transform:translateY(-7px);box-shadow:0 28px 48px -18px rgba(15,23,42,.5)}
.classcard:active{transform:translateY(-2px) scale(.99)}
.classcard::after{content:'';position:absolute;top:0;bottom:0;width:46%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.42),transparent);transform:translateX(-170%) skewX(-12deg);transition:transform .9s ease}
.classcard:hover::after{transform:translateX(330%) skewX(-12deg)}
.cnum{font-family:'Unbounded';font-weight:900;font-size:54px;line-height:1;display:flex;align-items:baseline;gap:9px;text-shadow:0 3px 16px rgba(0,0,0,.22)}
.cnum span{font-size:16px;font-weight:700;font-family:'Manrope';opacity:.95}
.cmeta{margin-top:6px;font-size:13px;font-weight:700;opacity:.93}
.cprog{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.ptrack{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.32);overflow:hidden}
.pfill{height:100%;border-radius:99px;background:#fff;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ppc{font-weight:800;font-size:12.5px}
.cstat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.2)}
.cstat.ok{background:rgba(255,255,255,.28)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.backbtn{width:46px;height:46px;border-radius:14px;border:1.5px solid #e2e8f0;background:#fff;display:grid;place-items:center;color:#334155;transition:.25s}
.backbtn:hover{background:#0f172a;color:#fff;border-color:#0f172a;transform:translateX(-3px)}
.gtitle{display:flex;align-items:center;gap:12px}
.gdot{width:14px;height:14px;border-radius:5px;transform:rotate(45deg);flex:none}
.glabel{font-family:'Unbounded';font-weight:900;font-size:clamp(18px,3vw,26px)}
.gsub{font-size:12.5px;font-weight:700;color:#64748b;margin-top:2px}
.savepill{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#64748b;background:#fff;border:1px solid #e2e8f0;padding:7px 13px;border-radius:99px}
.savedot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}
.savepill.flash{animation:saveflash .9s}
@keyframes saveflash{30%{background:#ecfdf5;border-color:#10b981;color:#047857}}
.datenav{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;box-shadow:0 10px 26px -18px rgba(15,23,42,.3);margin-top:18px}
.arrow{width:46px;height:46px;border-radius:12px;border:1.5px solid #e2e8f0;background:#fff;display:grid;place-items:center;color:#334155;transition:.22s}
.arrow:hover:not(:disabled){border-color:var(--acc);color:var(--acc);transform:scale(1.08);background:color-mix(in srgb,var(--acc) 7%,#fff)}
.arrow:disabled{opacity:.3;cursor:not-allowed}
.dmid{text-align:center}
.dbig{font-family:'Unbounded';font-weight:700;font-size:clamp(16px,2.6vw,23px)}
.dweek{color:#64748b;font-weight:800;font-size:13px;margin-top:3px;text-transform:uppercase;letter-spacing:.14em}
.todaybadge{display:inline-block;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;font-family:'Manrope';font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;vertical-align:middle;margin-left:8px;letter-spacing:.06em}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
#dinput{font-family:inherit;font-weight:700;color:#334155;border:1.5px solid #e2e8f0;border-radius:12px;padding:9px 12px;background:#fff;font-size:13.5px}
#dinput:focus{outline:none;border-color:var(--acc,#059669)}
.daychips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.tabs{display:flex;gap:10px;margin:20px 0 16px}
.tab{flex:1;position:relative;padding:14px 10px;border-radius:14px;border:1.5px solid #e2e8f0;background:#fff;font-weight:800;font-size:14.5px;color:#475569;transition:.25s}
.tab:hover{transform:translateY(-2px);border-color:#cbd5e1}
.tab.active{background:#0f172a;border-color:#0f172a;color:#fff;box-shadow:0 12px 26px -14px rgba(15,23,42,.55)}
.tab.active::after{content:'';position:absolute;left:14px;right:14px;bottom:6px;height:3px;border-radius:99px;background:var(--acc)}
.tbadge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:#dc2626;color:#fff;font-size:12.5px;margin-left:6px;animation:pulse 2s infinite}
.sumbar{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
.pbar{flex:1;min-width:130px;height:10px;background:#eef2f7;border-radius:99px;overflow:hidden}
#gcontent .pfill{background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff))}
.sumtxt{font-size:13px;font-weight:700;color:#475569;white-space:nowrap}
.btn{border:none;font-weight:800;border-radius:12px;padding:11px 16px;font-size:14px;transition:.22s;display:inline-flex;align-items:center;gap:7px}
.btn.sm{padding:9px 13px;font-size:13px}
.btn.ok{background:#ecfdf5;color:#047857;border:1.5px solid #a7f3d0}
.btn.ok:hover{background:#059669;color:#fff;transform:translateY(-1px)}
.btn.danger-ghost{background:#fff;color:#b91c1c;border:1.5px solid #fecaca}
.btn.danger-ghost:hover{background:#dc2626;color:#fff;transform:translateY(-1px)}
.btn.ghost{background:#fff;border:1.5px solid #e2e8f0;color:#334155}
.btn.ghost:hover{border-color:#94a3b8;transform:translateY(-1px)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:#fff;border:1px solid #e2e8f0;border-left:5px solid #e2e8f0;border-radius:14px;padding:12px 16px;margin-bottom:10px;transition:box-shadow .25s,transform .25s;animation:rise .5s both}
.row:hover{box-shadow:0 10px 24px -14px rgba(15,23,42,.28);transform:translateX(3px)}
.row.part{border-left-color:#f59e0b}
.row.full{border-left-color:#10b981;background:linear-gradient(90deg,#ecfdf5,#fff 45%)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13.5px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));flex:none}
.pinfo{flex:1 1 185px;min-width:150px}
.pname{font-weight:800;font-size:15px}
.psub{font-size:12px;font-weight:700;color:#94a3b8;margin-top:2px}
.row.full .psub{color:#059669}
.row.part .psub{color:#b45309}
.chips{display:flex;flex-wrap:wrap;gap:7px;flex:2 1 330px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;border:1.5px solid #e2e8f0;background:#f8fafc;color:#64748b;font-weight:700;font-size:12.5px;transition:all .18s}
.chip:hover{border-color:var(--cc);color:var(--cc);transform:translateY(-2px)}
.chip .tick{display:none;font-weight:900}
.chip.on{background:color-mix(in srgb,var(--cc) 12%,#fff);border-color:var(--cc);color:var(--cc);box-shadow:0 3px 10px -4px color-mix(in srgb,var(--cc) 60%,transparent)}
.chip.on .tick{display:inline}
.chip.pop{animation:pop .4s}
@keyframes pop{35%{transform:scale(1.16)}70%{transform:scale(.95)}}
.lstats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lstat{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;color:#64748b;animation:rise .5s both}
.lstat b{font-family:'Unbounded';font-size:18px;margin-right:7px}
.lstat.bad b{color:#dc2626}
.lstat.good2 b{color:#059669}
.subh{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#94a3b8;margin:20px 0 10px;font-weight:800}
.lcard{position:relative;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px 16px 14px 22px;margin-bottom:12px;overflow:hidden;animation:rise .5s both}
.lcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--cc)}
.lcard.full-ok{background:linear-gradient(90deg,#ecfdf5,#fff 60%)}
.lhead{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;flex-wrap:wrap}
.lcount{margin-left:auto;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.lcount.ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.lnames{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.lname{background:#fff;border:1.5px solid #fecaca;color:#b91c1c;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:10px;display:inline-flex;gap:6px;align-items:center;animation:rise .45s both}
.srow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 14px;margin-bottom:8px;flex-wrap:wrap;animation:rise .45s both}
.scount{background:#dc2626;color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;flex:none}
.srow b{font-size:14px}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.mchip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.allok{background:linear-gradient(135deg,#ecfdf5,#fff);border:1.5px solid #a7f3d0;border-radius:18px;padding:36px 20px;text-align:center;animation:rise .5s both}
.allok .big{font-size:46px}
.allok h3{font-family:'Unbounded';font-weight:700;margin:10px 0 6px;color:#065f46}
.allok p{color:#64748b;font-weight:600;font-size:14px}
.foot{margin-top:38px;text-align:center;font-size:12.5px;font-weight:600;color:#94a3b8}
@media(max-width:640px){
  .clockbox{margin-left:0;text-align:left;width:100%}
  .cnum{font-size:44px}
  .tabs{flex-direction:column}
  .daychips{margin-left:0}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="decor">
  <div class="wash a"></div><div class="wash b"></div><div class="wash c"></div>
  <svg class="bigstar" viewBox="0 0 64 64"><g fill="none" stroke="#059669" stroke-width="1.4"><rect x="14" y="14" width="36" height="36" rx="7"/><rect x="14" y="14" width="36" height="36" rx="7" transform="rotate(45 32 32)"/></g></svg>
</div>
<div class="topline"></div>
<main id="app"></main>

<script>
const LOGO_SRC="logo.png";
const FALLBACK_EMBLEM=`<svg viewBox="0 0 64 64" width="100%" height="100%"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient></defs><g fill="none" stroke="url(#eg)" stroke-width="3"><rect x="16" y="16" width="32" height="32" rx="7"/><rect x="16" y="16" width="32" height="32" rx="7" transform="rotate(45 32 32)"/></g><circle cx="32" cy="32" r="6.5" fill="#d97706"/></svg>`;
const EMBLEM=LOGO_SRC.trim()?`<img src="${LOGO_SRC}" alt="Bursa Enderun" onerror="this.outerHTML=FALLBACK_EMBLEM">`:FALLBACK_EMBLEM;

const STUDENTS={
 9:["Ahmet Yasin Abdussamed Şahin","Eyüp Ensari Kıncak","Faruk Selim Atacan","Mehmet Emre Ülker","Osman Kenan Çimendağ","Yunus Emre Karabulut"],
 10:["Eymen Akif Uyar","Muhammed Enes Kıncak","Ahmet Furkan Balarban","Mehmet Emre Okyay","Hilmihan Kırbıyık","Ahmet Selim Erdem","Mustafa Emir Beki","Hilmi Enes Bayram","Yusuf Kemal Yetim","Muhittin Kılıç"],
 11:["Tevfik Tuna Çakmak","Abdulkadir Düzgün","Ahmet Bedirhan Özcan","İhsan Bedir Şenol","Ahmet Enes Kuru","Ömer Faruk Cambaz","Hüseyin Emir Akkoç","Yusuf Gülcan","Ahmet Kerem Bayraktar","Mehmet Akif Çakır","Mehmet Hilmi Çelen","Sencer Çelikkanat","Kerem Yavuz Yılmaz","Arifhan İnan","İlhan Ahmet Çayır","Kerem Talha Yıldırım"],
 12:["Mehmet Selim Demirci","Emin Kerem Akçay","Ömer Yağız Emsen","Behlül Edip Çakır","Osman Yeşilırmak","Yunus Kerem Özdemir","Mehmet Yılmaz","Mehmet Enes İnan","Ahmet Fatih Ölmez","İbrahim Yağız Yigen"]
};
const GRADE_STYLE={
 9:{c1:"#34d399",c2:"#047857",acc:"#059669"},
 10:{c1:"#fbbf24",c2:"#b45309",acc:"#d97706"},
 11:{c1:"#fb7185",c2:"#be123c",acc:"#e11d48"},
 12:{c1:"#818cf8",c2:"#4338ca",acc:"#4f46e5"}
};
const DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const PROGRAMS=[
 ["Yatsı Namazı","Tesbih Namazı"],
 ["Sabah Namazı","Hatim","Vazife","Öğle Namazı","İkindi Namazı","Akşam Namazı","Yatsı Namazı"],
 ["Sabah Namazı","Hatim","Vazife","Öğle Namazı","İkindi Namazı","Akşam Namazı","Evvabin Namazı","Yatsı Namazı"],
 ["Sabah Namazı","Hatim","Vazife","Öğle Namazı","İkindi Namazı","Akşam Namazı","Yatsı Namazı","Hatm-i Nakşî"],
 ["Sabah Namazı","Hatim","Vazife","Öğle Namazı","İkindi Namazı","Akşam Namazı","Yatsı Namazı","Hatm-i Kâdirî"],
 ["Sabah Namazı","Evrad-ı Şerîf","Vazife","Cuma Namazı","İkindi Namazı","Akşam Namazı","Kur'ân-ı Kerîm Hatmi","Yatsı Namazı"],
 ["Sabah Namazı","Hatim","Vazife","Öğle Namazı"]
];
const ITEM_META={
 "Sabah Namazı":{e:"🌅",c:"#d97706"},"Öğle Namazı":{e:"☀️",c:"#ea580c"},
 "İkindi Namazı":{e:"🌤️",c:"#0d9488"},"Akşam Namazı":{e:"🌇",c:"#e11d48"},
 "Yatsı Namazı":{e:"🌙",c:"#4f46e5"},"Cuma Namazı":{e:"🕌",c:"#059669"},
 "Evvabin Namazı":{e:"✨",c:"#7c3aed"},"Tesbih Namazı":{e:"📿",c:"#0891b2"},
 "Hatim":{e:"📖",c:"#b45309"},"Hatm-i Nakşî":{e:"📖",c:"#a16207"},
 "Hatm-i Kâdirî":{e:"📖",c:"#92400e"},"Kur'ân-ı Kerîm Hatmi":{e:"📜",c:"#166534"},
 "Vazife":{e:"📝",c:"#2563eb"},"Evrad-ı Şerîf":{e:"🤲",c:"#9333ea"}
};

const MIN="2026-09-01",MAX="2026-12-31",KEY="bursa_enderun_yoklama_v1";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
let TODAY=iso(new Date());if(TODAY<MIN)TODAY=MIN;if(TODAY>MAX)TODAY=MAX;
let DATA;try{DATA=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){DATA={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DATA))}catch(e){}
 const p=document.querySelector(".savepill");if(p){p.classList.remove("flash");void p.offsetWidth;p.classList.add("flash");}}
const itemsFor=d=>PROGRAMS[parseISO(d).getDay()];
const dayName=d=>DAYS[parseISO(d).getDay()];
const fmtLong=d=>parseISO(d).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
const recOf=(d,g,n)=>((((DATA[d]||{})[g])||{})[n])||{};
function statsFor(d,g){const items=itemsFor(d);let done=0;
 STUDENTS[g].forEach(n=>items.forEach(it=>{if(recOf(d,g,n)[it])done++}));
 const total=STUDENTS[g].length*items.length;return{done,total,missing:total-done};}
const initials=n=>n.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toLocaleUpperCase("tr");

const S={grade:null,date:TODAY,tab:"yoklama",animated:true};
const app=document.getElementById("app");
const $=s=>document.querySelector(s);
let clockTimer=null;
function startClock(){tick();clockTimer=setInterval(tick,1000);}
function stopClock(){if(clockTimer){clearInterval(clockTimer);clockTimer=null;}}
function tick(){const n=new Date(),el=$("#clock");if(!el)return;
 el.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
 $("#clockdate").textContent=n.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}

const pill=it=>{const m=ITEM_META[it];return `<span class="dpill" style="--cc:${m.c}">${m.e} ${it}</span>`;};

function renderHome(){
 stopClock();
 const card=g=>{
  const cs=GRADE_STYLE[g],st=statsFor(TODAY,g),pc=st.total?Math.round(st.done/st.total*100):0;
  return `<button class="classcard" data-act="grade" data-g="${g}" style="--c1:${cs.c1};--c2:${cs.c2};animation-delay:${.08*(g-9)+.05}s">
   <div class="cnum">${g}<span>. Sınıf</span></div>
   <div class="cmeta">${STUDENTS[g].length} öğrenci · bugün ${itemsFor(TODAY).length} vakit</div>
   <div class="cprog"><div class="ptrack"><div class="pfill" style="width:${pc}%"></div></div><span class="ppc">%${pc}</span></div>
   <div class="cstat ${st.missing?"":"ok"}">${st.missing?"⏰ "+st.missing+" eksik işaret":"✓ Bugün tamamlandı"}</div></button>`;
 };
 app.innerHTML=`
 <header class="masthead">
   <div class="emblem">${EMBLEM}</div>
   <div class="brand"><div class="eyebrow">Günlük Vakit &amp; Yoklama Takibi</div><h1>BURSA ENDERUN<span class="dot">✦</span></h1></div>
   <div class="clockbox"><div class="clock" id="clock">--:--:--</div><div class="clockdate" id="clockdate"></div></div>
 </header>
 <div class="divider"></div>
 <section class="today-strip"><span class="daypill">Bugün · ${dayName(TODAY)}</span>${itemsFor(TODAY).map(pill).join("")}</section>
 <div class="sechead"><span class="sec-eyebrow">Sınıf Seç</span><h2>Yoklama Defteri</h2></div>
 <section class="classes">${[9,10,11,12].map(card).join("")}</section>
 <footer class="foot">İşaretlemeler bu cihazda otomatik saklanır · ${fmtLong(MIN)} – ${fmtLong(MAX)} arası aktif dönem</footer>`;
 startClock();
}

function renderGrade(keepScroll){
 stopClock();
 const y=window.scrollY,g=S.grade,cs=GRADE_STYLE[g],items=itemsFor(S.date),st=statsFor(S.date,g);
 const isToday=S.date===TODAY,wd=dayName(S.date);
 const chev=l=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="${l?"M15 18l-6-6 6-6":"M9 6l6 6-6 6"}"/></svg>`;
 app.innerHTML=`
 <div class="topbar">
   <button class="backbtn" data-act="home" title="Ana ekran"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
   <div class="gtitle"><span class="gdot" style="background:${cs.acc}"></span>
     <div><div class="glabel">${g}. SINIF YOKLAMASI</div><div class="gsub">${STUDENTS[g].length} öğrenci · ${wd} programı · ${items.length} vakit</div></div>
   </div>
   <div class="savepill"><span class="savedot"></span>Otomatik kayıt</div>
 </div>
 <section class="datenav" style="--acc:${cs.acc}">
   <button class="arrow" data-act="prev" ${S.date<=MIN?"disabled":""} title="Önceki gün">${chev(true)}</button>
   <div class="dmid"><div class="dbig">${fmtLong(S.date)}${isToday?'<span class="todaybadge">● Bugün</span>':""}</div><div class="dweek">${wd}</div></div>
   <button class="arrow" data-act="next" ${S.date>=MAX?"disabled":""} title="Sonraki gün">${chev(false)}</button>
 </section>
 <div class="tools" style="--acc:${cs.acc}">
   <input type="date" id="dinput" min="${MIN}" max="${MAX}" value="${S.date}">
   ${!isToday?'<button class="btn ghost sm" data-act="today">↺ Bugüne dön</button>':""}
   <div class="daychips">${items.map(pill).join("")}</div>
 </div>
 <div class="tabs" style="--acc:${cs.acc}">
   <button class="tab ${S.tab==="yoklama"?"active":""}" data-act="tab" data-tab="yoklama">📋 Yoklama Listesi</button>
   <button class="tab ${S.tab==="late"?"active":""}" data-act="tab" data-tab="late">⏰ Geç Kalanlar${st.missing?`<span class="tbadge">${st.missing}</span>`:""}</button>
 </div>
 <div id="gcontent" style="--acc:${cs.acc}"></div>`;
 renderTab();
 $("#dinput").addEventListener("change",e=>{const v=e.target.value;
  if(v&&v>=MIN&&v<=MAX){S.date=v;S.animated=true;renderGrade();}});
 window.scrollTo(0,keepScroll?y:0);
}

function chipHTML(n,it,on){
 const m=ITEM_META[it];
 return `<button class="chip ${on?"on":""}" style="--cc:${m.c}" data-act="toggle" data-name="${n}" data-item="${it}"><span>${m.e}</span>${it}<span class="tick">✓</span></button>`;
}

function renderTab(){
 const box=$("#gcontent"),g=S.grade,items=itemsFor(S.date),names=STUDENTS[g],cs=GRADE_STYLE[g];
 if(S.tab==="yoklama"){
  const st=statsFor(S.date,g),pc=st.total?Math.round(st.done/st.total*100):0;
  const rows=names.map((n,i)=>{
   const r=recOf(S.date,g,n),done=items.filter(it=>r[it]).length,full=done===items.length;
   const cls=full?"full":(done>0?"part":"none");
   const anim=S.animated?`animation-delay:${Math.min(i*.045,.6)}s`:"animation:none";
   return `<div class="row ${cls}" style="${anim}">
     <div class="avatar" style="--c1:${cs.c1};--c2:${cs.c2}">${initials(n)}</div>
     <div class="pinfo"><div class="pname">${n}</div><div class="psub">${full?"Eksiksiz ✓":(items.length-done)+" eksik"} · ${done}/${items.length}</div></div>
     <div class="chips">${items.map(it=>chipHTML(n,it,!!r[it])).join("")}</div></div>`;
  }).join("");
  box.innerHTML=`<div class="sumbar">
    <div class="pbar"><div class="pfill" style="width:${pc}%"></div></div>
    <div class="sumtxt"><b>${st.done}</b>/${st.total} işaret · %${pc}</div>
    <button class="btn ok sm" data-act="all">✓ Tümünü İşaretle</button>
    <button class="btn danger-ghost sm" data-act="clear">Temizle</button></div>${rows}`;
 }else{
  const groups=items.map(it=>({it,missing:names.filter(n=>!recOf(S.date,g,n)[it])}));
  const totalLate=groups.reduce((a,x)=>a+x.missing.length,0);
  const fullStu=names.filter(n=>items.every(it=>recOf(S.date,g,n)[it]));
  let h=`<div class="lstats"><div class="lstat bad" style="animation-delay:.02s"><b>${totalLate}</b>gecikme işareti</div>
   <div class="lstat good2" style="animation-delay:.08s"><b>${fullStu.length}</b>eksiksiz öğrenci</div></div>`;
  if(!totalLate){
   h+=`<div class="allok"><div class="big">🎉</div><h3>Maşallah! Herkes vaktinde</h3><p>Bu tarihte ${g}. sınıf için hiç gecikme görülmüyor.</p></div>`;
  }else{
   h+=`<h3 class="subh">Vakit / Program Bazında</h3>`;
   h+=groups.map((x,gi)=>{
    const m=ITEM_META[x.it],ok=x.missing.length===0;
    return `<div class="lcard ${ok?"full-ok":""}" style="--cc:${ok?"#10b981":m.c};${S.animated?`animation-delay:${gi*.05}s`:"animation:none"}">
      <div class="lhead"><span>${m.e}</span>${x.it}<span class="lcount ${ok?"ok":""}">${ok?"Herkes tam ✓":x.missing.length+" kişi"}</span></div>
      ${ok?"":`<div class="lnames">${x.missing.map((n,ni)=>`<span class="lname" style="${S.animated?`animation-delay:${gi*.05+ni*.03}s`:"animation:none"}">🕒 ${n}</span>`).join("")}</div>`}</div>`;
   }).join("");
   h+=`<h3 class="subh">Öğrenci Özeti</h3>`;
   h+=names.map(n=>({n,miss:items.filter(it=>!recOf(S.date,g,n)[it])})).filter(x=>x.miss.length)
     .sort((a,b)=>b.miss.length-a.miss.length)
     .map((x,i)=>`<div class="srow" style="${S.animated?`animation-delay:${i*.04}s`:"animation:none"}">
       <span class="scount">${x.miss.length}</span><b>${x.n}</b>
       <span class="mchips">${x.miss.map(it=>`<span class="mchip">${ITEM_META[it].e} ${it}</span>`).join("")}</span></div>`).join("");
  }
  box.innerHTML=h;
 }
}

function doToggle(n,it){
 DATA[S.date]=DATA[S.date]||{};const gd=DATA[S.date][S.grade]=DATA[S.date][S.grade]||{};
 const st=gd[n]=gd[n]||{};if(st[it])delete st[it];else st[it]=true;
 save();S.animated=false;renderGrade(true);
 const c=document.querySelector(`.chip[data-name="${n}"][data-item="${it}"]`);
 if(c)c.classList.add("pop");
}
function markAll(val){
 DATA[S.date]=DATA[S.date]||{};const gd=DATA[S.date][S.grade]=DATA[S.date][S.grade]||{};
 const items=itemsFor(S.date);
 STUDENTS[S.grade].forEach(n=>{if(val){gd[n]={};items.forEach(it=>gd[n][it]=true);}else delete gd[n];});
 save();S.animated=false;renderGrade(true);
}
function shiftDate(d){
 const nd=new Date(parseISO(S.date));nd.setDate(nd.getDate()+d);
 const v=iso(nd);if(v<MIN||v>MAX)return;
 S.date=v;S.animated=true;renderGrade();
}

document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;
 const act=el.dataset.act;
 if(act==="grade"){S.grade=+el.dataset.g;S.date=TODAY;S.tab="yoklama";S.animated=true;renderGrade();}
 else if(act==="home"){S.animated=true;renderHome();window.scrollTo(0,0);}
 else if(act==="tab"){S.tab=el.dataset.tab;S.animated=true;renderGrade();}
 else if(act==="prev")shiftDate(-1);
 else if(act==="next")shiftDate(1);
 else if(act==="today"){S.date=TODAY;S.animated=true;renderGrade();}
 else if(act==="all")markAll(true);
 else if(act==="clear"){if(confirm("Bu tarih için "+S.grade+". sınıfın tüm işaretleri silinsin mi?"))markAll(false);}
 else if(act==="toggle")doToggle(el.dataset.name,el.dataset.item);
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

renderHome();
</script>
</body>
</html>
